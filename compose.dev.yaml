version: "3.9"

services:
  postgres:
    image: postgres:latest
    container_name: zandag_app_db
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: dev@ERU.labs243
      POSTGRES_USER: ligantoine02
      POSTGRES_DB: zandag_app_db
    ports:
      - 127.0.0.1:5455:5432
    volumes:
      - zandag_app_pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:latest
    container_name: zandag_app_redis_cache
    restart: unless-stopped
    ports:
      - 127.0.0.1:6391:6379
    volumes:
      - zandag_app_cache:/data
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6391
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

    # Meilisearch
  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: zandag_app_meilisearch
    restart: unless-stopped
    ports:
      - 127.0.0.1:7701:7700
    volumes:
      - ./meili_data:/meili_data
    environment:
      MEILI_MASTER_KEY: MspKEcAJ8zF4B1lwZ4WcFoCK0JWT7RDKOU4YcDUjKqfq2f0G9CXVg3huiOTS9IE5
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  zandag_app_pg_data:

  zandag_app_cache:
